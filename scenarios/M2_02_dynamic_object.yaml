# M2_02 — Dynamic Object (Gazebo Actor Surrogate)

scenario_id: M2_02
name: dynamic_object_filtering
duration_sec: 18.0
seed: 20261212
rates:
  sensor_hz: 10.0
  map_hz: 1.0
scan:
  generator: analytic
plant:
  enabled: false
amcl_surrogate:
  enabled: false
publish_initialpose: true

# NOTE: This scenario requires Gazebo with dynamic actor.
# Current analytic scan generator does not model moving objects.
# For full validation, run in Gazebo with person walking through FOV.
# This YAML documents expected behavior, actual test requires Gazebo setup.

phases:
